// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    // Declaring the classpath alone doesn't require google-services.json to
    // exist — only actually *applying* the plugin (in app/build.gradle) does,
    // and that's guarded there behind a file-existence check. This app's
    // android/ is committed (bare workflow, not regenerated by `expo
    // prebuild`), so the googleServicesFile field in app.config.js has no
    // effect here — the native wiring has to be done directly. Version
    // matches what Expo's own config-plugin (@expo/config-plugins
    // android/GoogleServices.js) applies for the other two apps.
    classpath('com.google.gms:google-services:4.4.1')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
